[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezrename"
version = "1.0.0"
description = "EzRename - a polished bulk file renamer for Windows with a premium GUI and a first-class CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kritagya Dubey" }]
keywords = ["rename", "bulk-rename", "file-manager", "cli", "gui", "windows", "utility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/kritagyadubey/EzRename"
Repository = "https://github.com/kritagyadubey/EzRename"
Issues = "https://github.com/kritagyadubey/EzRename/issues"
Changelog = "https://github.com/kritagyadubey/EzRename/blob/main/CHANGELOG.md"

[project.scripts]
ezrename = "ezrename.cli.main:main"
ezrename-gui = "ezrename.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ezrename.*"]
